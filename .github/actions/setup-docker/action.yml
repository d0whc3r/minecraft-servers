name: 'Setup Docker Environment'
description: 'Setup Docker daemon and required services for Minecraft server testing'

inputs:
  docker-version:
    description: 'Docker version to install'
    required: false
    default: '28.5.2'

runs:
  using: 'composite'
  steps:
    - name: Verify Docker is available
      shell: bash
      run: |
        echo "🔍 Checking Docker installation..."
        docker --version || (echo "❌ Docker not found, installing..." && exit 1)

    - name: Setup Docker (if needed)
      uses: docker/setup-docker-action@v4
      if: failure()
      with:
        version: ${{ inputs.docker-version }}

    - name: Create Minecraft Network
      shell: bash
      run: |
        echo "🌐 Creating Minecraft network..."
        docker network create minecraft-network --driver bridge || echo "Network already exists"

    - name: Verify Docker Setup
      shell: bash
      run: |
        echo "✅ Docker setup verification:"
        docker --version
        docker info --format 'Server Version: {{.ServerVersion}}'
        docker network ls | grep minecraft-network || echo "❌ Network not found"
