name: 'Run BATS Tests'
description: 'Execute a BATS test file with timeout, summary and container cleanup'

inputs:
  test-pattern:
    description: 'Test file(s) to run'
    required: false
    default: 'tests/bats/config-validation.bats'

  timeout:
    description: 'Test execution timeout in minutes'
    required: false
    default: '30'

  parallel-jobs:
    description: 'Number of parallel BATS jobs'
    required: false
    default: '1'

runs:
  using: 'composite'
  steps:
    - name: Run BATS tests
      shell: bash
      run: |
        export CI=true
        export DEBUG=false

        echo "Pattern: ${{ inputs.test-pattern }}"
        echo "Parallel jobs: ${{ inputs.parallel-jobs }}"
        echo "Timeout: ${{ inputs.timeout }} minutes"
        echo "---"

        timeout ${{ fromJSON(inputs.timeout) }}m pnpm exec bats --jobs ${{ inputs.parallel-jobs }} --timing ${{ inputs.test-pattern }}

    - name: Cleanup test containers
      if: always()
      shell: bash
      run: |
        docker ps -a --filter "name=mc-" --format "{{.Names}}" | xargs -r docker rm -f || true
        docker network prune -f || true
        docker volume prune -f || true
