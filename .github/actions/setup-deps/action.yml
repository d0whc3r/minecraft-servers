name: 'Setup Dependencies'
description: 'Install project dependencies including pnpm, bats, and Node.js'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'

    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Verify installations
      shell: bash
      run: |
        node --version
        pnpm --version
