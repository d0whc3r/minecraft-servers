name: 'Setup Dependencies'
description: 'Install project dependencies including pnpm, bats, and Node.js'

inputs:
  node-version:
    description: 'Node.js version to install'
    required: false
    default: '22'

runs:
  using: 'composite'
  steps:
    # pnpm BEFORE setup-node: setup-node reads packageManager and enables its
    # built-in pnpm store cache for every later install in the job
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Verify installations
      shell: bash
      run: |
        node --version
        pnpm --version
