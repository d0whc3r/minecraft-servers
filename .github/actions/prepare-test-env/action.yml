name: 'Prepare Test Environment'
description: 'Prepare the test environment with cached Docker images and test data'

inputs:
  modpack-filter:
    description: 'Filter for modpacks to test (regex pattern)'
    required: false
    default: '.*'

runs:
  using: 'composite'
  steps:
    - name: Cache Minecraft Server Images
      uses: actions/cache@v4
      with:
        path: |
          /tmp/docker-images
        key: minecraft-server-images-${{ runner.os }}-${{ hashFiles('docker-compose.yml') }}
        restore-keys: |
          minecraft-server-images-${{ runner.os }}-

    - name: Pull and Cache Minecraft Server Images
      shell: bash
      run: |
        set -e

        # Create cache directory
        mkdir -p /tmp/docker-images

        # Define images to cache
        IMAGES=(
          "itzg/minecraft-server:latest"
          "itzg/minecraft-server:java8"
          "itzg/minecraft-server:java11"
          "itzg/minecraft-server:java17"
          "itzg/minecraft-server:java21"
        )

        echo "🔄 Pulling and caching Minecraft server images..."

        for image in "${IMAGES[@]}"; do
          echo "📥 Pulling $image..."
          if docker pull "$image"; then
            echo "✅ Successfully pulled $image"

            # Save image to cache directory for faster loading
            image_name=$(echo "$image" | tr '/' '_' | tr ':' '_')
            docker save "$image" -o "/tmp/docker-images/${image_name}.tar"
            echo "💾 Saved $image to cache"
          else
            echo "⚠️  Failed to pull $image, continuing..."
          fi
        done

        echo "📊 Docker images cache prepared"

    - name: Load Cached Minecraft Images
      shell: bash
      run: |
        set -e

        echo "🔄 Loading cached Minecraft images..."

        # Load all cached images
        for tar_file in /tmp/docker-images/*.tar; do
          if [ -f "$tar_file" ]; then
            echo "📤 Loading $(basename "$tar_file" .tar)..."
            docker load -i "$tar_file"
            echo "✅ Loaded $(basename "$tar_file" .tar)"
          fi
        done

        echo "🎯 Cached images loaded successfully"

    - name: Cache Server Data Directories
      uses: actions/cache@v4
      with:
        path: |
          servers/*/data
          servers/*/mods
        key: server-data-${{ runner.os }}-${{ hashFiles('config/modpacks/*.env') }}
        restore-keys: |
          server-data-${{ runner.os }}-
          server-data-

    - name: Create .env file for Docker Compose
      shell: bash
      run: |
        set -e

        echo "📝 Creating .env file..."

        # Debug: Show which environment variables are available
        echo "🔍 Environment variables check:"
        echo "  EULA: ${EULA:-NOT_SET}"
        echo "  CF_API_KEY: ${CF_API_KEY:0:10}..." # Show first 10 chars for security
        echo "  ENABLE_RCON: ${ENABLE_RCON:-NOT_SET}"

        # Create .env file with required variables for Docker Compose
        printf '# CI Environment - Auto-generated\n' > .env
        printf 'EULA=%s\n' "${EULA:-TRUE}" >> .env
        printf 'NETWORK_NAME=%s\n' "${NETWORK_NAME:-minecraft-network}" >> .env
        printf 'BASE_PORT=%s\n' "${BASE_PORT:-25565}" >> .env
        printf 'COMPOSE_PROJECT_NAME=%s\n' "${COMPOSE_PROJECT_NAME:-minecraft-servers}" >> .env
        printf 'CF_API_KEY=%s\n' "${CF_API_KEY:-dummy_key}" >> .env
        printf 'ENABLE_RCON=%s\n' "${ENABLE_RCON:-true}" >> .env
        printf 'RCON_PASSWORD=%s\n' "${RCON_PASSWORD:-minecraft}" >> .env
        printf 'RCON_PORT=%s\n' "${RCON_PORT:-25575}" >> .env
        printf 'BROADCAST_RCON_TO_OPS=%s\n' "${BROADCAST_RCON_TO_OPS:-false}" >> .env
        printf 'TZ=%s\n' "${TZ:-UTC}" >> .env
        printf 'ENABLE_ROLLING_LOGS=%s\n' "${ENABLE_ROLLING_LOGS:-true}" >> .env
        printf 'USE_AIKAR_FLAGS=%s\n' "${USE_AIKAR_FLAGS:-true}" >> .env
        printf 'ONLINE_MODE=%s\n' "${ONLINE_MODE:-false}" >> .env
        printf 'ALLOW_FLIGHT=%s\n' "${ALLOW_FLIGHT:-true}" >> .env

        echo "✅ .env file created"

    - name: Filter modpacks for this runner
      shell: bash
      id: filter-modpacks
      run: |
        # Get all modpack configs and filter based on input pattern
        if [ -n "${{ inputs.modpack-filter }}" ] && [ "${{ inputs.modpack-filter }}" != ".*" ]; then
          # Filter modpacks using the provided pattern
          MODPACKS=$(find config/modpacks -name "*.env" -type f | grep -E "${{ inputs.modpack-filter }}" | sed 's|config/modpacks/||' | sed 's|\.env$||' | tr '\n' ' ')
        else
          # Use all modpacks if no filter
          MODPACKS=$(find config/modpacks -name "*.env" -type f | sed 's|config/modpacks/||' | sed 's|\.env$||' | tr '\n' ' ')
        fi

        echo "modpacks=$MODPACKS" >> $GITHUB_OUTPUT
        echo "count=$(echo $MODPACKS | wc -w)" >> $GITHUB_OUTPUT

        # Set environment variable for BATS tests
        echo "TEST_MODPACKS=$MODPACKS" >> $GITHUB_ENV

    - name: Display test configuration
      shell: bash
      run: |
        echo "Runner: ${{ runner.name }}"
        echo "Modpack filter: ${{ inputs.modpack-filter }}"
        echo "Selected modpacks: ${{ steps.filter-modpacks.outputs.modpacks }}"
        echo "Modpack count: ${{ steps.filter-modpacks.outputs.count }}"
        echo "TEST_MODPACKS environment variable set for BATS tests"

        # Show cache status
        echo ""
        echo "📊 Cache Status:"
        echo "🐳 Docker images cached: $(docker images itzg/minecraft-server --format "table {{.Repository}}:{{.Tag}}" | wc -l) images"
        echo "📁 Server data cache: $(find servers -name "data" -type d 2>/dev/null | wc -l) directories"
