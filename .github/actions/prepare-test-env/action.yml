name: 'Prepare Test Environment'
description: 'Create the CI .env and select the modpacks this runner will test'

inputs:
  modpack-filter:
    description: 'Filter for modpacks to test (regex pattern)'
    required: false
    default: '.*'

runs:
  using: 'composite'
  steps:
    - name: Create .env file for Docker Compose
      shell: bash
      run: ./scripts/ci/create-test-env.sh

    - name: Filter modpacks for this runner
      shell: bash
      id: filter-modpacks
      run: ./scripts/ci/filter-modpacks.sh '${{ inputs.modpack-filter }}'

    - name: Display test configuration
      shell: bash
      run: |
        echo "Runner: ${{ runner.name }}"
        echo "Modpack filter: ${{ inputs.modpack-filter }}"
        echo "Selected modpacks: ${{ steps.filter-modpacks.outputs.modpacks }}"
        echo "Modpack count: ${{ steps.filter-modpacks.outputs.count }}"
