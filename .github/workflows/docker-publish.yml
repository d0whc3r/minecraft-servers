name: Docker Publish

# Construye y publica la imagen del panel (apps/web/Dockerfile) en GHCR con
# el nombre exacto que espera charts/web-panel:
#   ghcr.io/d0whc3r/minecraft-servers/panel:latest
#
# Tras el primer push, GHCR crea el paquete como PRIVADO: hay que cambiarlo a
# público en GitHub -> Packages -> panel -> Package settings, o configurar
# imagePullSecrets en el chart (los pulls anónimos del cluster devuelven 403).
on:
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'charts/**'
      - 'config/modpacks/**'
      - 'docs/modpacks/**'
      - 'scripts/k8s-jobs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

# Sin cancel-in-progress: no cortar un push a medias si llega otro commit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  REGISTRY: ghcr.io
  # github.repository ya viene en minúsculas (d0whc3r/minecraft-servers);
  # docker/metadata-action normaliza igualmente por si cambia el nombre.
  IMAGE_NAME: ${{ github.repository }}/panel

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push panel image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          # El Dockerfile copia charts/, config/modpacks/ y docs/modpacks/,
          # así que el contexto es la raíz del repo (ver apps/web/Dockerfile).
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print published image
        run: echo "Published ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
