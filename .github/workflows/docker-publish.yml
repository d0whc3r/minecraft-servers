name: Docker Publish

# Builds and publishes the panel image (apps/web/Dockerfile) to GHCR with
# the exact name charts/web-panel expects:
#   ghcr.io/d0whc3r/minecraft-servers/panel:latest
#
# After the first push, GHCR creates the package as PRIVATE: it must be
# switched to public in GitHub -> Packages -> panel -> Package settings,
# or imagePullSecrets must be configured in the chart (the cluster's
# anonymous pulls return 403).
on:
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'charts/**'
      - 'config/modpacks/**'
      - 'docs/modpacks/**'
      - 'scripts/k8s-jobs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

# No cancel-in-progress: never cut a push in half when another commit lands
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  REGISTRY: ghcr.io
  # github.repository is already lowercase (d0whc3r/minecraft-servers);
  # docker/metadata-action normalizes anyway in case the name changes.
  IMAGE_NAME: ${{ github.repository }}/panel

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push panel image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          # The Dockerfile copies charts/, config/modpacks/ and
          # docs/modpacks/, so the context is the repo root (see
          # apps/web/Dockerfile).
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print published image
        run: echo "Published ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
