name: Publish Wiki

# Regenerates the GitHub Wiki from docs/ and pushes the result to the
# <repo>.wiki.git repository on every change to the documentation.
#
# PREREQUISITE: the wiki must already exist. Create the first page once via
# the repository's "Wiki" tab in the GitHub UI; afterwards this workflow keeps
# it in sync. The default GITHUB_TOKEN can push to the wiki of the same
# repository with "contents: write" permission (set below).

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'scripts/build-wiki.mjs'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

concurrency:
  group: publish-wiki
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    name: Sync docs to Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate documentation links
        run: node scripts/build-wiki.mjs --check

      - name: Clone wiki repository
        run: |
          git clone \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" \
            wiki

      - name: Build wiki pages
        run: node scripts/build-wiki.mjs --out wiki --clean --branch "${{ github.ref_name }}"

      - name: Commit and push
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No documentation changes to publish."
          else
            git commit -m "docs: sync wiki from ${{ github.sha }}"
            git push
          fi
