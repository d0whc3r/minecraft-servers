name: Charts Publish

# Publica los charts de charts/ en GHCR como artefactos OCI, para poder
# instalar la pila sin clonar el repo (scripts/k8s-bootstrap.sh):
#
#   helm upgrade --install minecraft-router \
#     oci://ghcr.io/d0whc3r/minecraft-servers/charts/mc-router --version 0.1.2
#
# Solo publica el chart cuya carpeta cambie en el push, y exige subir el
# campo version de su Chart.yaml (mismo push). workflow_dispatch publica
# todos los charts.
#
# Tras el primer push, GHCR crea cada paquete como PRIVADO: hay que cambiarlo
# a publico en GitHub -> Packages -> charts/<chart> -> Package settings, o los
# pulls anonimos del cluster devolveran 401/403.
on:
  push:
    branches: [master]
    paths:
      - 'charts/**'
      - '.github/workflows/charts-publish.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  REGISTRY: ghcr.io
  CHARTS: mc-router web-panel minecraft-server

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish charts to GHCR (OCI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # fetch-depth 0 para poder hacer diff contra github.event.before
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Detect charts to publish
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # En workflow_dispatch (o primer push) no hay commit anterior:
          # publicar todos los charts tal cual estan.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "charts=$CHARTS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          publish=""
          for chart in $CHARTS; do
            if ! git diff --name-only "$BEFORE" "$SHA" -- "charts/$chart" | grep -q .; then
              continue
            fi
            if git diff "$BEFORE" "$SHA" -- "charts/$chart/Chart.yaml" \
                | grep -qE '^\+version:'; then
              publish+=("$chart")
            else
              echo "::error::charts/$chart cambió sin subir 'version' en su Chart.yaml — bump obligatorio para publicar en OCI"
              exit 1
            fi
          done
          echo "charts=${publish[*]}" >> "$GITHUB_OUTPUT"

      - name: Lint charts
        if: steps.changed.outputs.charts != ''
        run: |
          for chart in ${{ steps.changed.outputs.charts }}; do
            helm lint "charts/$chart"
          done

      - name: Log in to GHCR
        if: steps.changed.outputs.charts != ''
        run: helm registry login "$REGISTRY" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Package and push charts
        if: steps.changed.outputs.charts != ''
        env:
          CHARTS: ${{ steps.changed.outputs.charts }}
        run: |
          for chart in $CHARTS; do
            echo "::group::$chart"
            helm package "charts/$chart"
            helm push "$chart"-*.tgz "oci://$REGISTRY/${{ github.repository }}/charts"
            echo "::endgroup::"
          done
