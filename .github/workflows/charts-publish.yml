name: Charts Publish

# Publishes the charts under charts/ to GHCR as OCI artifacts, so the stack
# can be installed without cloning the repo (scripts/k8s-bootstrap.sh):
#
#   helm upgrade --install minecraft-router \
#     oci://ghcr.io/d0whc3r/minecraft-servers/charts/mc-router
#   (no --version = newest published chart)
#
# Each publish pushes the bumped Chart.yaml version and re-tags the same
# manifest as "latest" (usable by raw-OCI tooling; helm only resolves
# semver tags and ignores it). Only publishes the chart whose folder changed
# in the push, and requires bumping the version field of its Chart.yaml
# (same push). workflow_dispatch publishes every chart.
#
# After the first push, GHCR creates each package as PRIVATE: it must be
# switched to public in GitHub -> Packages -> charts/<chart> -> Package
# settings, or the anonymous cluster pulls will return 401/403.
on:
  push:
    branches: [master]
    paths:
      - 'charts/**'
      - '.github/workflows/charts-publish.yml'
      - 'scripts/ci/detect-changed-charts.sh'
      - 'scripts/ci/publish-charts.sh'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  REGISTRY: ghcr.io
  CHARTS: mc-router web-panel minecraft-server

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish charts to GHCR (OCI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # fetch-depth 0 to diff against github.event.before
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Detect charts to publish
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          CHARTS: ${{ env.CHARTS }}
        run: ./scripts/ci/detect-changed-charts.sh

      - name: Log in to GHCR
        if: steps.changed.outputs.charts != ''
        run: helm registry login "$REGISTRY" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Lint, package and push charts
        if: steps.changed.outputs.charts != ''
        env:
          OCI_REPO: ${{ env.REGISTRY }}/${{ github.repository }}/charts
        run: ./scripts/ci/publish-charts.sh ${{ steps.changed.outputs.charts }}
