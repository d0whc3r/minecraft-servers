name: Code Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    name: Helm charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Lint and render charts
        run: make helm-template

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest # shellcheck is preinstalled on the runner image
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Shellcheck all management and CI scripts
        run: shellcheck -S warning scripts/*.sh scripts/ci/*.sh scripts/k8s-jobs/*.sh

      - name: Validate workflow and action definitions
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- v1.7.7
          ./actionlint -color

  validate:
    name: Validate Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Load pipeline configuration
        id: config
        run: ./scripts/ci/load-config.sh

      - name: Setup Dependencies
        uses: ./.github/actions/setup-deps
        with:
          node-version: ${{ steps.config.outputs.NODE_VERSION || '22' }}

      - name: Run validation suite
        run: pnpm run lint

      - name: Type-check web panel
        run: pnpm --filter @minecraft-servers/web check

      - name: Unit tests (web panel)
        run: pnpm --filter @minecraft-servers/web test

  go:
    name: Go TUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go (version from apps/tui/go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/tui/go.mod
          cache-dependency-path: apps/tui/go.sum

      - name: Check formatting
        working-directory: apps/tui
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Vet
        working-directory: apps/tui
        run: go vet ./...

      - name: Unit tests
        working-directory: apps/tui
        run: go test -race ./...
