name: Code Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Load pipeline configuration
        id: config
        run: ./scripts/ci/load-config.sh

      - name: Setup Dependencies
        uses: ./.github/actions/setup-deps
        with:
          node-version: ${{ steps.config.outputs.NODE_VERSION || '22' }}

      - name: Run validation suite
        run: pnpm run lint

      - name: Type-check web panel
        run: pnpm --filter @minecraft-servers/web check

      - name: Unit tests (web panel)
        run: pnpm --filter @minecraft-servers/web test
