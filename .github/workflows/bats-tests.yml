name: BATS Test Suite

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job to determine test matrix based on available modpacks
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
      total-modpacks: ${{ steps.generate-matrix.outputs.total-modpacks }}
      java-versions: ${{ steps.generate-matrix.outputs.java-versions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Generate test matrix
        id: generate-matrix
        run: |
          set -euo pipefail

          # Get all modpack configurations
          MODPACKS=$(find config/modpacks -name "*.env" -type f | sed 's|config/modpacks/||' | sed 's|\.env$||' | sort | tr '\n' ' ')
          MODPACK_ARRAY=($MODPACKS)
          TOTAL_MODPACKS=${#MODPACK_ARRAY[@]}

          echo "Found $TOTAL_MODPACKS modpacks: ${MODPACK_ARRAY[*]}"
          echo "total-modpacks=$TOTAL_MODPACKS" >> $GITHUB_OUTPUT

          # Optimized chunking strategy: max 2 mods per chunk, max 2 parallel jobs
          CHUNK_SIZE=2  # Maximum 2 modpacks per job to avoid timeouts
          echo "Using chunk size: $CHUNK_SIZE (max 2 mods per job)"

          # Create matrix JSON with Java version analysis
          MATRIX_JSON="{\"include\":["

          # Track all required Java versions across all chunks
          ALL_JAVA_VERSIONS=""

          # Create chunks
          CHUNK_INDEX=0
          i=0
          while [ $i -lt $TOTAL_MODPACKS ]; do
            # Calculate end index for this chunk
            end=$((i + CHUNK_SIZE))
            if [ $end -gt $TOTAL_MODPACKS ]; then
              end=$TOTAL_MODPACKS
            fi

            # Extract chunk modpacks
            CHUNK_MODPACKS=("${MODPACK_ARRAY[@]:i:CHUNK_SIZE}")
            CHUNK_COUNT=${#CHUNK_MODPACKS[@]}

            echo "Chunk $CHUNK_INDEX: ${CHUNK_MODPACKS[*]} (count: $CHUNK_COUNT)"

            # Create comma-separated list for modpacks field
            MODPACK_LIST=""
            for modpack in "${CHUNK_MODPACKS[@]}"; do
              if [ -n "$MODPACK_LIST" ]; then
                MODPACK_LIST="$MODPACK_LIST,$modpack"
              else
                MODPACK_LIST="$modpack"
              fi
            done

            # Create regex pattern for this chunk (escape special regex chars)
            MODPACK_PATTERN=""
            for modpack in "${CHUNK_MODPACKS[@]}"; do
              if [ -n "$MODPACK_PATTERN" ]; then
                MODPACK_PATTERN="$MODPACK_PATTERN|$modpack"
              else
                MODPACK_PATTERN="$modpack"
              fi
            done

            # Analyze Java versions needed for this chunk
            CHUNK_JAVA_VERSIONS=$(./scripts/analyze-java-versions.sh "${CHUNK_MODPACKS[@]}")
            echo "Chunk $CHUNK_INDEX Java versions: $CHUNK_JAVA_VERSIONS"

            # Add to global Java versions
            for version in $CHUNK_JAVA_VERSIONS; do
              if [[ "$ALL_JAVA_VERSIONS" != *"$version"* ]]; then
                ALL_JAVA_VERSIONS="${ALL_JAVA_VERSIONS:+$ALL_JAVA_VERSIONS }$version"
              fi
            done

            # Escape special characters for JSON
            MODPACK_LIST=$(echo "$MODPACK_LIST" | sed 's/\\/\\\\/g; s/"/\\"/g')
            MODPACK_PATTERN=$(echo "$MODPACK_PATTERN" | sed 's/\\/\\\\/g; s/"/\\"/g')
            CHUNK_JAVA_VERSIONS=$(echo "$CHUNK_JAVA_VERSIONS" | sed 's/\\/\\\\/g; s/"/\\"/g')

            MATRIX_JSON="${MATRIX_JSON}{\"chunk\":$CHUNK_INDEX,\"modpacks\":\"$MODPACK_LIST\",\"pattern\":\"$MODPACK_PATTERN\",\"count\":$CHUNK_COUNT,\"java_versions\":\"$CHUNK_JAVA_VERSIONS\"},"

            i=$((i + CHUNK_SIZE))
            CHUNK_INDEX=$((CHUNK_INDEX + 1))
          done

          # Remove trailing comma and close JSON
          MATRIX_JSON=${MATRIX_JSON%,}
          MATRIX_JSON="${MATRIX_JSON}]}"

          echo "Generated matrix: $MATRIX_JSON"

          # Validate JSON syntax
          if command -v jq >/dev/null 2>&1; then
            echo "$MATRIX_JSON" | jq . >/dev/null || (echo "Invalid JSON generated"; exit 1)
          fi

          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
          echo "java-versions=$ALL_JAVA_VERSIONS" >> $GITHUB_OUTPUT

  # Job to pre-download required Docker images
  prepare-images:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Load configuration
        id: config
        run: |
          # Load configuration from .github/workflows/config
          if [ -f ".github/workflows/config" ]; then
            echo "Loading configuration from .github/workflows/config"
            while IFS='=' read -r key value; do
              # Skip comments and empty lines
              [[ $key =~ ^[[:space:]]*# ]] && continue
              [[ -z "$key" ]] && continue
              # Remove whitespace
              key=$(echo "$key" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              value=$(echo "$value" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              echo "$key=$value" >> $GITHUB_OUTPUT
            done < .github/workflows/config
          else
            echo "Configuration file not found, using defaults"
          fi

      - name: Setup Docker Environment
        uses: ./.github/actions/setup-docker
        with:
          docker-version: ${{ steps.config.outputs.DOCKER_VERSION || '28.5.2' }}

      - name: Cache Docker temporary files
        uses: actions/cache@v5
        with:
          path: |
            /tmp/docker-images
            ~/.docker
          key: docker-images-${{ runner.os }}-${{ hashFiles('docker-compose.yml') }}-${{ needs.prepare-matrix.outputs.java-versions }}
          restore-keys: |
            docker-images-${{ runner.os }}-${{ hashFiles('docker-compose.yml') }}-
            docker-images-${{ runner.os }}-

      - name: Pre-download Required Minecraft Images
        run: |
          set -e

          # Create cache directory
          mkdir -p /tmp/docker-images

          # Parse required Java versions from prepare-matrix output
          REQUIRED_VERSIONS="${{ needs.prepare-matrix.outputs.java-versions }}"
          echo "🔍 Required Java versions: $REQUIRED_VERSIONS"

          # Map versions to Docker image tags
          declare -A VERSION_MAP=(
              ["latest"]="itzg/minecraft-server:latest"
              ["java8"]="itzg/minecraft-server:java8"
              ["java11"]="itzg/minecraft-server:java11"
              ["java17"]="itzg/minecraft-server:java17"
              ["java21"]="itzg/minecraft-server:java21"
          )

          echo "📥 Pre-downloading required Minecraft server images..."

          for version in $REQUIRED_VERSIONS; do
            if [[ -n "${VERSION_MAP[$version]}" ]]; then
              image="${VERSION_MAP[$version]}"
              echo "📦 Downloading $image..."

              if docker pull "$image"; then
                echo "✅ Successfully downloaded $image"

                # Save image to cache directory
                image_name=$(echo "$image" | tr '/' '_' | tr ':' '_')
                docker save "$image" -o "/tmp/docker-images/${image_name}.tar"
                echo "💾 Saved $image to cache"
              else
                echo "⚠️  Failed to download $image, continuing..."
              fi
            else
              echo "⚠️  Unknown version '$version', skipping..."
            fi
          done

          echo "🎯 Pre-download complete. Images cached for test jobs."
  test:
    needs: [prepare-matrix, prepare-images]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    env:
      # Environment variables from .env.template
      EULA: TRUE
      NETWORK_NAME: minecraft-network
      BASE_PORT: 25565
      COMPOSE_PROJECT_NAME: minecraft-servers
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      ENABLE_RCON: true
      RCON_PASSWORD: minecraft
      RCON_PORT: 25575
      BROADCAST_RCON_TO_OPS: false
      TZ: UTC
      ENABLE_ROLLING_LOGS: true
      USE_AIKAR_FLAGS: true
      ONLINE_MODE: false
      ALLOW_FLIGHT: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Load configuration
        id: config
        run: |
          # Load configuration from .github/workflows/config
          if [ -f ".github/workflows/config" ]; then
            echo "Loading configuration from .github/workflows/config"
            while IFS='=' read -r key value; do
              # Skip comments and empty lines
              [[ $key =~ ^[[:space:]]*# ]] && continue
              [[ -z "$key" ]] && continue
              # Remove whitespace
              key=$(echo "$key" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              value=$(echo "$value" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              echo "$key=$value" >> $GITHUB_OUTPUT
            done < .github/workflows/config
          else
            echo "Configuration file not found, using defaults"
          fi

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pnpm-store
            node_modules
            .pnpm-debug.log*
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('package.json') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
            pnpm-${{ runner.os }}-

      - name: Cache Docker temporary files
        uses: actions/cache@v5
        with:
          path: |
            /tmp/docker-images
            ~/.docker
          key: docker-images-${{ runner.os }}-${{ hashFiles('docker-compose.yml') }}-${{ needs.prepare-matrix.outputs.java-versions }}
          restore-keys: |
            docker-images-${{ runner.os }}-${{ hashFiles('docker-compose.yml') }}-
            docker-images-${{ runner.os }}-

      - name: Cache test artifacts and logs
        uses: actions/cache@v5
        with:
          path: |
            test-results/
            *.log
            .env
          key: test-artifacts-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            test-artifacts-${{ runner.os }}-

      - name: Setup Dependencies
        uses: ./.github/actions/setup-deps
        with:
          node-version: ${{ steps.config.outputs.NODE_VERSION || '22' }}

      - name: Setup Docker Environment
        uses: ./.github/actions/setup-docker
        with:
          docker-version: ${{ steps.config.outputs.DOCKER_VERSION || '28.5.2' }}

      - name: Prepare Test Environment
        uses: ./.github/actions/prepare-test-env
        with:
          modpack-filter: ${{ matrix.pattern }}

      - name: Run BATS Tests
        uses: ./.github/actions/run-bats-tests
        with:
          test-pattern: "tests/bats/script-execution.bats"
          timeout: ${{ steps.config.outputs.TEST_TIMEOUT_MINUTES || '45' }}
          parallel-jobs: ${{ steps.config.outputs.PARALLEL_JOBS || '1' }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-chunk-${{ matrix.chunk }}
          path: |
            *.log
            test-results/
          retention-days: 7

  # Job to collect and summarize all test results
  summarize:
    needs: [prepare-matrix, prepare-images, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download test artifacts
        uses: actions/download-artifact@v6
        with:
          path: test-artifacts
        continue-on-error: true

      - name: Generate summary report
        run: |
          echo "## 🧪 BATS Test Suite Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall status
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ **All tests passed!**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.test.result }}" == "failure" ]; then
            echo "❌ **Some tests failed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Tests completed with issues**" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Execution Statistics" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Modpacks:** ${{ needs.prepare-matrix.outputs.total-modpacks }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Parallel Jobs:** Max 2 concurrent jobs" >> $GITHUB_STEP_SUMMARY
          echo "- **Chunk Size:** Max 2 modpacks per job" >> $GITHUB_STEP_SUMMARY
          echo "- **Required Java Versions:** ${{ needs.prepare-matrix.outputs.java-versions }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Duration:** Check individual job timings" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚡ Performance Optimizations" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Parallel test execution: max 2 concurrent jobs for GitHub free runners" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Smart Docker image caching (only required Java versions: ${{ needs.prepare-matrix.outputs.java-versions }})" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Pre-download images in dedicated job to avoid duplication" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Server data caching for faster test startup" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ pnpm dependencies caching with node_modules" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Docker temporary files caching" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Test artifacts and logs caching" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Network and volume cleanup between tests" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Reusable GitHub Actions for maintainability" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Optimized chunking: max 2 modpacks per job to avoid timeouts" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 Technical Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Version:** ${{ steps.config.outputs.DOCKER_VERSION || '28.5.2' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Node.js Version:** ${{ steps.config.outputs.NODE_VERSION || '22' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **pnpm Version:** 10.20.0 (from packageManager)" >> $GITHUB_STEP_SUMMARY
          echo "- **BATS Version:** 1.13.0 (from package.json devDependencies)" >> $GITHUB_STEP_SUMMARY

          # Show matrix details
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Test Matrix" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.prepare-matrix.outputs.matrix }}" != "" ]; then
            MATRIX_DATA='${{ needs.prepare-matrix.outputs.matrix }}'
            if command -v jq >/dev/null 2>&1; then
              echo "$MATRIX_DATA" | jq -r '.include[] | "- Chunk \(.chunk): \(.modpacks) (\(.count) modpacks)"' >> $GITHUB_STEP_SUMMARY
            else
              echo "Matrix data available (jq not installed for formatting)" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          # List artifacts if any
          if [ -d "test-artifacts" ] && [ "$(ls -A test-artifacts)" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📁 Test Artifacts" >> $GITHUB_STEP_SUMMARY
            find test-artifacts -type f | head -10 | while read -r file; do
              echo "- \`$file\`" >> $GITHUB_STEP_SUMMARY
            done
            if [ "$(find test-artifacts -type f | wc -l)" -gt 10 ]; then
              echo "- ... and $(($(find test-artifacts -type f | wc -l) - 10)) more files" >> $GITHUB_STEP_SUMMARY
            fi
          fi
