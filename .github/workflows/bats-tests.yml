name: BATS Tests

# Fast BATS suite: validation of scripts, configurations and compose files
# (tests/bats/config-validation.bats). It starts no servers and downloads no
# images, so it can run on every push/PR. The heavy E2E suite (real server
# startup) lives in e2e-tests.yml and is manual-only.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tests:
    name: Fast validation (no server startup)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Load pipeline configuration
        id: config
        run: ./scripts/ci/load-config.sh

      - name: Setup Dependencies
        uses: ./.github/actions/setup-deps
        with:
          node-version: ${{ steps.config.outputs.NODE_VERSION || '22' }}

      # US1-TC008 renders the compose files and needs a .env
      - name: Create test .env
        run: cp .env.example .env

      - name: Run fast BATS tests
        run: pnpm exec bats tests/bats/config-validation.bats
