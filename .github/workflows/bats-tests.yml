name: BATS Test Suite

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job to determine test matrix based on available modpacks
  prepare-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
      total-modpacks: ${{ steps.generate-matrix.outputs.total-modpacks }}
      java-versions: ${{ steps.generate-matrix.outputs.java-versions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Load configuration
        id: config
        run: ./.github/scripts/load-pipeline-config.sh >> "$GITHUB_OUTPUT"

      - name: Generate test matrix
        id: generate-matrix
        env:
          CHUNK_STRATEGY: ${{ steps.config.outputs.CHUNK_STRATEGY }}
        run: ./.github/scripts/generate-test-matrix.sh >> "$GITHUB_OUTPUT"

  # Job to pre-download required Docker images
  prepare-images:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Load configuration
        id: config
        run: ./.github/scripts/load-pipeline-config.sh >> "$GITHUB_OUTPUT"

      - name: Setup Docker Environment
        uses: ./.github/actions/setup-docker
        with:
          docker-version: ${{ steps.config.outputs.DOCKER_VERSION || '28.5.2' }}

      - name: Cache Docker temporary files
        uses: actions/cache@v5
        with:
          path: |
            /tmp/docker-images
            ~/.docker
          key: docker-images-${{ runner.os }}-${{ hashFiles('docker-compose.yml') }}-${{ needs.prepare-matrix.outputs.java-versions }}
          restore-keys: |
            docker-images-${{ runner.os }}-${{ hashFiles('docker-compose.yml') }}-
            docker-images-${{ runner.os }}-

      - name: Pre-download Required Minecraft Images
        run: ./.github/scripts/predownload-images.sh ${{ needs.prepare-matrix.outputs.java-versions }}
  test:
    needs: [prepare-matrix, prepare-images]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    env:
      # Environment variables from .env.template
      EULA: TRUE
      NETWORK_NAME: minecraft-network
      BASE_PORT: 25565
      COMPOSE_PROJECT_NAME: minecraft-servers
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      ENABLE_RCON: true
      RCON_PASSWORD: minecraft
      RCON_PORT: 25575
      BROADCAST_RCON_TO_OPS: false
      TZ: UTC
      ENABLE_ROLLING_LOGS: true
      USE_AIKAR_FLAGS: true
      ONLINE_MODE: false
      ALLOW_FLIGHT: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Load configuration
        id: config
        run: ./.github/scripts/load-pipeline-config.sh >> "$GITHUB_OUTPUT"

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pnpm-store
            node_modules
            .pnpm-debug.log*
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('package.json') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
            pnpm-${{ runner.os }}-

      - name: Cache Docker temporary files
        uses: actions/cache@v5
        with:
          path: |
            /tmp/docker-images
            ~/.docker
          key: docker-images-${{ runner.os }}-${{ hashFiles('docker-compose.yml') }}-${{ needs.prepare-matrix.outputs.java-versions }}
          restore-keys: |
            docker-images-${{ runner.os }}-${{ hashFiles('docker-compose.yml') }}-
            docker-images-${{ runner.os }}-

      - name: Cache test artifacts and logs
        uses: actions/cache@v5
        with:
          path: |
            test-results/
            *.log
            .env
          key: test-artifacts-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            test-artifacts-${{ runner.os }}-

      - name: Setup Dependencies
        uses: ./.github/actions/setup-deps

      - name: Setup Docker Environment
        uses: ./.github/actions/setup-docker
        with:
          docker-version: ${{ steps.config.outputs.DOCKER_VERSION || '28.5.2' }}

      - name: Prepare Test Environment
        uses: ./.github/actions/prepare-test-env
        with:
          modpack-filter: ${{ matrix.pattern }}

      - name: Run BATS Tests
        uses: ./.github/actions/run-bats-tests
        with:
          test-pattern: "tests/bats/script-execution.bats"
          timeout: ${{ steps.config.outputs.TEST_TIMEOUT_MINUTES || '45' }}
          parallel-jobs: ${{ steps.config.outputs.PARALLEL_JOBS || '1' }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-chunk-${{ matrix.chunk }}
          path: |
            *.log
            test-results/
          retention-days: 7

  # Job to collect and summarize all test results
  summarize:
    needs: [prepare-matrix, prepare-images, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Load configuration
        id: config
        run: ./.github/scripts/load-pipeline-config.sh >> "$GITHUB_OUTPUT"

      - name: Download test artifacts
        uses: actions/download-artifact@v8
        with:
          path: test-artifacts
        continue-on-error: true

      - name: Generate summary report
        env:
          TEST_RESULT: ${{ needs.test.result }}
          TOTAL_MODPACKS: ${{ needs.prepare-matrix.outputs.total-modpacks }}
          JAVA_VERSIONS: ${{ needs.prepare-matrix.outputs.java-versions }}
          MATRIX_JSON: ${{ needs.prepare-matrix.outputs.matrix }}
          DOCKER_VERSION: ${{ steps.config.outputs.DOCKER_VERSION || '28.5.2' }}
          CHUNK_STRATEGY: ${{ steps.config.outputs.CHUNK_STRATEGY || 'medium' }}
          MAX_PARALLEL: '2'
        run: ./.github/scripts/generate-summary.sh >> "$GITHUB_STEP_SUMMARY"
