---
name: Feature Request
description: Suggest a new feature or enhancement
title: "[FEATURE] "
labels: ["enhancement", "triage"]
assignees: []
body:
- type: markdown
  attributes:
    value: |
      ## Feature Request

      Thank you for suggesting a new feature! Please fill out the information below.

- type: textarea
  id: summary
  attributes:
    label: Summary
    description: A brief summary of the feature request.
    placeholder: "What feature would you like to see?"
  validations:
    required: true

- type: textarea
  id: problem
  attributes:
    label: Problem/Use Case
    description: What problem does this feature solve? What use case does it address?
    placeholder: "Describe the problem this feature would solve..."
  validations:
    required: true

- type: textarea
  id: solution
  attributes:
    label: Proposed Solution
    description: Describe your proposed solution.
    placeholder: "How should this feature work?"
  validations:
    required: true

- type: textarea
  id: alternatives
  attributes:
    label: Alternative Solutions
    description: Have you considered any alternative solutions?
    placeholder: "List any alternative approaches you've considered..."

- type: textarea
  id: additional
  attributes:
    label: Additional Context
    description: Any additional context, screenshots, or examples.
    placeholder: "Add any other context or screenshots about the feature request here..."

- type: checkboxes
  id: checklist
  attributes:
    label: Checklist
    description: Please check all that apply.
    options:
    - label: This feature request is not a duplicate
      required: true
    - label: This feature would benefit other users
      required: false
    - label: I am willing to help implement this feature
      required: false
