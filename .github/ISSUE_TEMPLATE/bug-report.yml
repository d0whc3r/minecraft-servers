---
name: Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels: ["bug", "triage"]
assignees: []
body:
- type: markdown
  attributes:
    value: |
      ## Bug Report

      Thank you for reporting a bug! Please fill out the information below to help us investigate.

- type: textarea
  id: description
  attributes:
    label: Description
    description: A clear and concise description of what the bug is.
    placeholder: "Describe the bug here..."
  validations:
    required: true

- type: textarea
  id: steps
  attributes:
    label: Steps to Reproduce
    description: Steps to reproduce the behavior.
    placeholder: |
      1. Go to '...'
      2. Click on '....'
      3. Scroll down to '....'
      4. See error
  validations:
    required: true

- type: textarea
  id: expected
  attributes:
    label: Expected Behavior
    description: What you expected to happen.
    placeholder: "What should happen..."
  validations:
    required: true

- type: textarea
  id: actual
  attributes:
    label: Actual Behavior
    description: What actually happened.
    placeholder: "What actually happened..."
  validations:
    required: true

- type: textarea
  id: environment
  attributes:
    label: Environment
    description: Information about your environment.
    placeholder: |
      - OS: [e.g., Ubuntu 20.04]
      - Docker version: [e.g., 24.0.1]
      - Docker Compose version: [e.g., v2.18.1]
      - Minecraft Multi-Server version: [e.g., v1.0.0]
      - Modpack: [e.g., ATM8, vanilla]
  validations:
    required: true

- type: textarea
  id: logs
  attributes:
    label: Logs
    description: Relevant log output or error messages.
    placeholder: |
      ```
      Paste logs here
      ```
    render: shell

- type: textarea
  id: additional
  attributes:
    label: Additional Context
    description: Any additional context about the problem.
    placeholder: "Add any other context about the problem here..."

- type: checkboxes
  id: checklist
  attributes:
    label: Checklist
    description: Please check all that apply.
    options:
    - label: I have searched for similar issues and confirmed this is not a duplicate
      required: true
    - label: I have tried the latest version and the issue still occurs
      required: false
    - label: I have included all relevant information (logs, environment, steps)
      required: true
