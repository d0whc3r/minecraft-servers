# Dynamic Minecraft Multi-Server Configuration
# This template instantiates a new server for each modpack dynamically
# Usage: docker compose -p mc-<server> --env-file config/modpacks/<server>.env up -d
#
# All itzg/minecraft-server environment variables are supported via the env_file.
# See: https://docker-minecraft-server.readthedocs.io/en/latest/variables/

services:
  minecraft-server:
    image: itzg/minecraft-server:${JAVA_VERSION:-latest}
    container_name: ${CONTAINER_NAME:-mc-server}
    # Load environment variables from TWO sources:
    # 1. .env - Shared/private variables (EULA, RCON_PASSWORD, etc.)
    # 2. SERVER_CONFIG_FILE - Server-specific config (overrides .env)
    env_file:
      - .env
      - ${SERVER_CONFIG_FILE}
    # Route announcements for mc-router (docker-compose.router.yml): players
    # connect to ${SERVER_NAME}.${MC_ROUTER_DOMAIN} and mc-router forwards the
    # session to this container over minecraft-network. Game ports are NEVER
    # published; set MC_ROUTER_DEFAULT=true in a server config to catch
    # unknown hostnames.
    labels:
      - 'mc-router.host=${SERVER_NAME:-unknown}.${MC_ROUTER_DOMAIN:-mc.local}'
      - 'mc-router.default=${MC_ROUTER_DEFAULT:-false}'
    ports:
      # RCON only, and bound to loopback: unique port per server, never
      # exposed to the network. Game traffic always goes via mc-router.
      - '127.0.0.1:${RCON_PORT:-25575}:${RCON_PORT:-25575}'
    environment:
      # Override SERVER_PORT to always be 25565 internally
      # The external port mapping handles the actual port exposure
      SERVER_PORT: 25565
    volumes:
      - ${SERVER_DATA_DIR:-./data}:/data
      - ${SERVER_MODS_DIR:-./mods}:/mods
      - ${SERVER_BACKUP_DIR:-./backups}:/backups
    networks:
      - minecraft-network
    # restart: unless-stopped
    stdin_open: true
    tty: true
    healthcheck:
      test: mc-health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m

networks:
  minecraft-network:
    name: minecraft-network
    driver: bridge
    external: true
