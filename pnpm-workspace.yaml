packages:
  - apps/*

# Approved build scripts for workspace dependencies (pnpm >= 10 blocks them
# by default). Kept here so both apps share one allowlist.
allowBuilds:
  esbuild: false
  sharp: false

minimumReleaseAgeExclude:
  - '@astrojs/node@11.1.6'
  - '@astrojs/react@6.0.6'
  - astro@7.3.3
  - jsdom@30.1.0
  - prettier-plugin-astro@1.0.1

# Security pins for transitive dependencies (GHSA-wq5f-xc86-pv6w for sharp,
# GHSA-68fv-2mgg-jv7q for source-map-js).
overrides:
  'sharp@<0.35.5': 0.35.5
  'source-map-js@<1.2.2': 1.2.2
