apiVersion: v1
kind: Secret
metadata:
  name: {{ include "web-panel.secretName" . }}
  labels:
    {{- include "web-panel.labels" . | nindent 4 }}
type: Opaque
stringData:
  MCPANEL_USER: {{ .Values.admin.user | quote }}
  {{- if .Values.admin.password }}
  MCPANEL_PASSWORD: {{ .Values.admin.password | quote }}
  {{- end }}
{{- if not .Values.existingSharedEnvSecret }}
---
# Mounted as /repo/.env: the shared server configuration the panel merges with
# every config/modpacks/<server>.env (same role as .env in the docker setup).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "web-panel.sharedEnvSecretName" . }}
  labels:
    {{- include "web-panel.labels" . | nindent 4 }}
type: Opaque
stringData:
  .env: |
    {{- range $key, $value := .Values.sharedEnv }}
    {{ $key }}={{ $value }}
    {{- end }}
{{- end }}
{{- if and .Values.ssh.enabled (not .Values.ssh.existingAuthorizedKeysSecret) }}
---
# Login keys for the panel's sshd (mc-tui over ssh). Empty authorizedKeys
# renders an empty key list: nobody can log in until keys are added.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "web-panel.fullname" . }}-ssh-keys
  labels:
    {{- include "web-panel.labels" . | nindent 4 }}
type: Opaque
stringData:
  authorized_keys: |
    {{- range .Values.ssh.authorizedKeys }}
    {{ . }}
    {{- end }}
{{- end }}
