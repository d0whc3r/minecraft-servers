{{- if and .Values.backup.enabled (not .Values.existingSecret) (not .Values.secretEnv) -}}
{{- fail "backup.enabled needs secretEnv (RCON_PASSWORD for save-off/save-all) or existingSecret" }}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "minecraft-server.fullname" . }}
  labels:
    {{- include "minecraft-server.labels" . | nindent 4 }}
spec:
  # Minecraft state lives on RWO storage and one instance may touch the world:
  # scale to 0 to stop, never roll two instances at once.
  strategy:
    type: Recreate
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "minecraft-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "minecraft-server.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # The game server never talks to the API server (the panel and router
      # use their own ServiceAccounts): do not mount a token it cannot use
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "minecraft-server.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      volumes:
        - name: data
          {{- if .Values.persistence.data.existingClaim }}
          # An explicit existingClaim wins even when enabled=false (the claim
          # exists; enabled only governs chart-managed claims)
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.data.existingClaim }}
          {{- else if .Values.persistence.data.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "minecraft-server.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: backups
          {{- if .Values.persistence.backups.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.backups.existingClaim }}
          {{- else if .Values.persistence.backups.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "minecraft-server.fullname" . }}-backups
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: mods
          {{- if .Values.persistence.mods.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.mods.existingClaim }}
          {{- else if .Values.persistence.mods.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "minecraft-server.fullname" . }}-mods
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: minecraft
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            {{- if .Values.env }}
            - configMapRef:
                name: {{ include "minecraft-server.fullname" . }}
            {{- end }}
            {{- if .Values.existingSecret }}
            - secretRef:
                name: {{ .Values.existingSecret }}
            {{- else if .Values.secretEnv }}
            - secretRef:
                name: {{ include "minecraft-server.fullname" . }}
            {{- end }}
          env:
            # Chart wiring always wins over modpack values (k8s precedence:
            # env entries beat envFrom), like docker-compose does with its
            # explicit environment block.
            - name: SERVER_PORT
              value: {{ .Values.server.port | quote }}
            - name: ENABLE_RCON
              value: {{ .Values.rcon.enabled | quote }}
            {{- if .Values.rcon.enabled }}
            - name: RCON_PORT
              value: {{ .Values.rcon.port | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: minecraft
              containerPort: {{ .Values.server.port }}
              protocol: TCP
            {{- if .Values.rcon.enabled }}
            - name: rcon
              containerPort: {{ .Values.rcon.port }}
              protocol: TCP
            {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: backups
              mountPath: /backups
            - name: mods
              mountPath: /mods
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            exec:
              command: [mc-health]
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            exec:
              command: [mc-health]
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          startupProbe:
            exec:
              command: [mc-health]
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{/* Explicit .Values.resources wins. Otherwise derive memory
              requests/limits from the JVM heap (env.MEMORY) so a standalone
              helm install is not left unlimited: request = heap + 15%, limit
              = heap + 35% + 256Mi — the same headroom docker-compose applies
              via DOCKER_MEM_LIMIT. */}}
          {{- $heap := (get (default dict .Values.env) "MEMORY") | default "2G" | toString -}}
          {{- $resources := deepCopy (.Values.resources | default dict) -}}
          {{- if and (eq (len $resources) 0) (regexMatch "^[0-9]+[GgMm]$" $heap) -}}
          {{- $number := trimSuffix "G" (trimSuffix "g" (trimSuffix "M" (trimSuffix "m" $heap))) | int -}}
          {{- $mb := $number -}}
          {{- if regexMatch "[Gg]$" $heap -}}{{- $mb = mul $number 1024 -}}{{- end -}}
          {{- $_ := set $resources "requests" (dict "memory" (printf "%dMi" (add $mb (div (mul $mb 15) 100)))) -}}
          {{- $_ := set $resources "limits" (dict "memory" (printf "%dMi" (add $mb (div (mul $mb 35) 100) 256))) -}}
          {{- end -}}
          resources:
            {{- toYaml $resources | nindent 12 }}
          stdin: true
          tty: true
        {{- if .Values.backup.enabled }}
        - name: backup
          image: "{{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag }}"
          imagePullPolicy: {{ .Values.backup.image.pullPolicy }}
          # Only what mc-backup needs: the RCON credentials from the Secret
          # (never the whole server ConfigMap) plus its own wiring below
          env:
            - name: RCON_HOST
              value: 127.0.0.1
            - name: RCON_PORT
              value: {{ .Values.rcon.port | quote }}
            - name: BACKUP_INTERVAL
              value: {{ .Values.backup.interval | quote }}
            - name: PRUNE_BACKUPS_DAYS
              value: {{ .Values.backup.pruneDays | quote }}
            - name: XDG_CONFIG_HOME
              value: /tmp
            {{- if .Values.existingSecret }}
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: RCON_PASSWORD
            {{- else }}
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "minecraft-server.secretName" . }}
                  key: RCON_PASSWORD
            {{- end }}
            {{- with .Values.backup.env }}
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: backups
              mountPath: /backups
          resources:
            {{- toYaml .Values.backup.resources | nindent 12 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
