apiVersion: v1
kind: Service
metadata:
  name: {{ include "minecraft-server.fullname" . }}
  labels:
    {{- include "minecraft-server.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.router.host }}
    # mc-router (in-cluster discovery) registers this hostname for the service
    mc-router.itzg.me/externalServerName: {{ .Values.router.host | quote }}
    {{- end }}
    {{- if .Values.router.default }}
    mc-router.itzg.me/defaultServer: "true"
    {{- end }}
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # Port name matters: mc-router looks for "minecraft"/"mc-router" on the
    # backend Service when picking the target port.
    - name: minecraft
      port: {{ .Values.service.port }}
      targetPort: minecraft
      protocol: TCP
    {{- if .Values.rcon.enabled }}
    - name: rcon
      port: {{ .Values.rcon.port }}
      targetPort: rcon
      protocol: TCP
    {{- end }}
  selector:
    {{- include "minecraft-server.selectorLabels" . | nindent 4 }}
