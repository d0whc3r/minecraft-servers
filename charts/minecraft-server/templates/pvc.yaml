{{- $vols := list
      (dict "vol" .Values.persistence.data "suffix" "data")
      (dict "vol" .Values.persistence.backups "suffix" "backups")
      (dict "vol" .Values.persistence.mods "suffix" "mods") -}}
{{- range $entry := $vols -}}
{{- if and $entry.vol.enabled (not $entry.vol.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "minecraft-server.fullname" $ }}-{{ $entry.suffix }}
  labels:
    {{- include "minecraft-server.labels" $ | nindent 4 }}
  # worlds/backups outlive the release: helm uninstall keeps them
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml $entry.vol.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ $entry.vol.size }}
  {{- with $entry.vol.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
{{- end }}
