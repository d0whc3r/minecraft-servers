version: '3.8'

services:
  test-minecraft-server:
    image: itzg/minecraft-server:latest
    container_name: test-minecraft-server
    ports:
      - "25565:25565"
      - "25575:25575"
    environment:
      EULA: "TRUE"
      VERSION: "1.20.1"
      TYPE: "VANILLA"
      DIFFICULTY: "normal"
      MAX_PLAYERS: "20"
      MOTD: "Test Minecraft Server"
      MEMORY: "2G"
      CPU_COUNT: "2"
      SERVER_PORT: "25565"
      RCON_PORT: "25575"
      RCON_PASSWORD: "testpassword123"
      LEVEL_TYPE: "default"
      SEED: "123456789"
      GENERATE_STRUCTURES: "true"
    volumes:
      - ./test-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc-health", "--host=localhost", "--port=25565"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s